[project]
name = "github-changelog-md"
version = "0.10.0-pre"
description = "Generate a Markdown Changelog from your Github repository."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Grant Ramsay", email = "seapagan@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control",
  "Topic :: System :: Monitoring",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = [
  "pygithub>=2.10.0",
  "rich>=15.0.0",
  "rtoml>=0.13.0",
  "simple-toml-settings>=0.13.0",
  "typer>=0.27.2",
]

[project.urls]
"Bug Tracker" = "https://github.com/seapagan/github-changelog-md/issues"
"Changelog" = "https://github.com/seapagan/github-changelog-md/blob/main/CHANGELOG.md"
"Pull Requests" = "https://github.com/seapagan/github-changelog-md/pulls"
"homepage" = "https://changelog.seapagan.net"
"repository" = "https://github.com/seapagan/github-changelog-md"

[project.scripts]
github-changelog-md = "github_changelog_md.main:app"

[dependency-groups]
dev = [
  "faker>=40.37.0",
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-autorefs>=1.4.4",
  "mkdocs-git-revision-date-localized-plugin>=1.5.4",
  "mkdocs-material>=9.7.7",
  "mkdocs-minify-plugin>=0.8.0",
  "mock>=5.2.0",
  "mypy>=2.3.1",
  "poethepoet>=0.48.0",
  "prek>=0.5.0",
  "pyfakefs>=6.2.0",
  "pygments>=2.21.0",
  "pymarkdownlnt>=0.9.39",
  "pymdown-extensions>=11.0.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.1.0",
  "pytest-reverse>=1.9.0",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.5",
  "ty>=0.0.75",
  "types-markdown>=3.10.2.20260712",
  "zizmor==1.29.0",  # Keep in sync with .github/workflows/zizmor.yml.
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["github_changelog_md"]
omit = ["*/tests/*"]

[tool.poe.tasks]
# setup PoeThePoet tasks
pre.cmd = "prek run --all-files"
pre.help = "Run pre-commit checks using 'prek'"
mypy.cmd = "mypy . --strict --exclude ^site/"
mypy.help = "Run mypy checks"
ty.cmd = "ty check --output-format concise"
ty.help = "Run ty checks"
format.help = "Format code with Ruff"
format.cmd = "ruff format ."
ruff.help = "Run Ruff checks"
ruff.cmd = "ruff check . --output-format concise"
test.help = "Run tests using Pytest"
test.cmd = "pytest"
markdown.cmd = "pymarkdown scan  -r github_changelog_md/**/*.md docs/**/*.md CHANGELOG.md"
markdown.help = "Run markdown checks"
zizmor.cmd = "zizmor --persona=pedantic ."
zizmor.help = "Audit GitHub Actions with Zizmor"

type.ignore_fail = "return_non_zero"
type.sequence = ["ty", "mypy"]
type.help = "Run ty and mypy type checkers"

# run all linting checks in sequence. we want to run them all, even if one fails
lint.ignore_fail = "return_non_zero"
lint.sequence = ["format", "ruff", "type", "markdown", "zizmor"]
lint.help = "Run all linting checks"

"docs:publish".cmd = "mkdocs gh-deploy"
"docs:publish".help = "Publish documentation to GitHub Pages"
"docs:build".cmd = "mkdocs build --strict"
"docs:build".help = "Build documentation locally to './site' folder"
"docs:serve".cmd = "mkdocs serve -w TODO.md -w CHANGELOG.md -w CONTRIBUTING.md --livereload"
"docs:serve".help = "Serve documentation locally"
"docs:serve:all".cmd = "mkdocs serve -w TODO.md -w CHANGELOG.md -w CONTRIBUTING.md -a 0.0.0.0:8000 --livereload"
"docs:serve:all".help = "Serve documentation locally on all interfaces"

changelog.cmd = "github-changelog-md"
changelog.help = "Generate the CHANGELOG.md file"

# configure assorted tools and linters
[tool.pymarkdown]
plugins.md014.enabled = false
plugins.md024.siblings_only = true
plugins.md036.enabled = false
plugins.md046.enabled = false

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report", "term-missing", "--cov-report", "html"]
filterwarnings = []
pythonpath = ["github_changelog_md"]
mock_use_standalone_module = true

[tool.ruff]
line-length = 80

src = ["github_changelog_md"]
target-version = "py310"  # minimum python version supported

[tool.ruff.lint]
select = ["ALL"]  # we are being very strict!
ignore = [
  "CPY001",  # copyright in each file is overkill for this project.
  "COM812",  # ignored for ruff formatting
  "ISC001"  # ignored for ruff formatting
]

[tool.ruff.lint.isort]
known-first-party = ["github_changelog_md"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
  "S101",  # we can (and MUST!) use 'assert' in test files.
]
"github_changelog_md/main.py" = [
  "UP007",
  "PLR0913",
]  # These cause issues in Typer Apps

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.tombi.format.rules]
line-width = 80

[tool.uv.build-backend]
module-root = ""
